server {
    listen 80;
    server_name pzy-rag.dev www.pzy-rag.dev;

    root /opt/wiki-rag/web-frontend/dist;
    index index.html;

    client_max_body_size 100M;

    # Strongly recommended before a real login system exists.
    auth_basic "Wiki-RAG";
    auth_basic_user_file /etc/nginx/.wiki_rag_passwd;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep SSE streaming responsive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
